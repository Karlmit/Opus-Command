name: Build and Push

# Build on main AND on tags. The main build publishes nothing (push is gated to
# tags below) — its sole purpose is to populate the GitHub Actions (gha) layer
# cache on the default branch. GHA cache is ref-scoped: a run can only restore
# caches from its own ref or the default branch, so tag builds can only inherit
# warm layers if main has produced them. Versioned images are still published
# only on tag pushes, keeping APP_VERSION clean.
on:
  push:
    branches: ['main']
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase — github.repository_owner preserves original case
      - name: Set lowercase image names
        run: |
          echo "APP_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/opus-command:latest" >> $GITHUB_ENV
          echo "WS_WORK_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/opus-command-workspace-claude-code:latest" >> $GITHUB_ENV
          echo "WS_PRIVATE_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/opus-command-workspace-private:latest" >> $GITHUB_ENV

      - name: Get version
        id: version
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          # Publish only on tag pushes; main builds run solely to seed the gha cache.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push work workspace image
        uses: docker/build-push-action@v5
        with:
          context: ./workspace-images/claude-code
          platforms: linux/amd64
          # Publish only on tag pushes; main builds run solely to seed the gha cache.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.WS_WORK_IMAGE }}
          cache-from: type=gha,scope=workspace-work
          cache-to: type=gha,scope=workspace-work,mode=max

      - name: Build and push private workspace image
        uses: docker/build-push-action@v5
        with:
          context: ./workspace-images/private
          platforms: linux/amd64
          # Publish only on tag pushes; main builds run solely to seed the gha cache.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.WS_PRIVATE_IMAGE }}
          cache-from: type=gha,scope=workspace-private
          cache-to: type=gha,scope=workspace-private,mode=max
