name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase — github.repository_owner preserves original case
      - name: Set lowercase image names
        run: |
          echo "APP_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/opus-command:latest" >> $GITHUB_ENV
          echo "WS_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/opus-command-workspace-claude-code:latest" >> $GITHUB_ENV

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./package.json').version")+$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push workspace image
        uses: docker/build-push-action@v5
        with:
          context: ./workspace-images/claude-code
          platforms: linux/amd64
          push: true
          tags: ${{ env.WS_IMAGE }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
