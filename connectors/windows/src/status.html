<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opus Connector</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #111318;
        color: #f4f7fb;
      }

      body {
        margin: 0;
        background: #111318;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 22px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      img {
        width: 36px;
        height: 36px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #9ca8ba;
        font-size: 13px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #4ade80;
      }

      .dot.not-paired,
      .dot.error {
        background: #f87171;
      }

      .dot.connecting,
      .dot.offline {
        background: #fbbf24;
      }

      section {
        border: 1px solid #273040;
        border-radius: 8px;
        background: #171b23;
        padding: 14px;
      }

      form {
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 5px;
        color: #9ca8ba;
        font-size: 12px;
      }

      input {
        min-width: 0;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f131a;
        color: #f8fafc;
        padding: 8px 10px;
        font: 13px "Segoe UI", system-ui, sans-serif;
      }

      .form-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      dl {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 8px 12px;
        margin: 0;
        font-size: 13px;
      }

      dt {
        color: #8f9aab;
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, "Cascadia Mono", monospace;
        color: #d7deea;
      }

      button {
        align-self: flex-start;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #1f2937;
        color: #f8fafc;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .error-text {
        margin: 0;
        color: #fca5a5;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .hidden {
        display: none;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .version {
        color: #6b7689;
        font-size: 12px;
      }

      .update {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #273040;
        border-radius: 8px;
        background: #171b23;
        padding: 10px 14px;
        font-size: 13px;
      }

      .update.available {
        border-color: #2563eb;
        background: #15233f;
        color: #cfe0ff;
      }

      .caps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
      }

      .cap {
        border: 1px solid #273040;
        border-radius: 6px;
        background: #0f131a;
        padding: 8px 10px;
        font-size: 12px;
      }

      .cap b {
        display: block;
        color: #cbd5e1;
        font-weight: 600;
      }

      .cap span {
        color: #8f9aab;
        overflow-wrap: anywhere;
      }

      .cap.ok b::before {
        content: "● ";
        color: #4ade80;
      }

      .cap.no b::before {
        content: "○ ";
        color: #64748b;
      }

      h2 {
        margin: 4px 0;
        font-size: 13px;
        font-weight: 600;
        color: #9ca8ba;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="row">
        <div class="row" style="justify-content: flex-start;">
          <img src="../assets/mark-dark.png" alt="" />
          <div>
            <h1>Opus Connector</h1>
            <div class="status"><span id="dot" class="dot"></span><span id="status">Starting</span></div>
          </div>
        </div>
        <div class="version" id="version"></div>
      </header>

      <div class="update hidden" id="updateBanner">
        <span id="updateText"></span>
        <button id="checkUpdates" type="button">Check for updates</button>
      </div>

      <section id="pairingSection">
        <form id="pairForm">
          <label>
            Opus Command URL
            <input id="serverInput" name="server" placeholder="https://opus.jabba.se" autocomplete="url" />
          </label>
          <label>
            Pairing token
            <input id="tokenInput" name="token" placeholder="opus_pair_..." autocomplete="off" />
          </label>
          <div class="form-grid">
            <label>
              Name
              <input id="nameInput" name="name" placeholder="Windows PC" autocomplete="off" />
            </label>
            <label>
              Labels
              <input id="labelsInput" name="labels" value="windows,powershell" autocomplete="off" />
            </label>
          </div>
          <button id="pairButton" type="submit">Connect</button>
          <p id="pairError" class="error-text hidden"></p>
        </form>
      </section>

      <section>
        <dl>
          <dt>Name</dt><dd id="name">-</dd>
          <dt>Server</dt><dd id="server">-</dd>
          <dt>Connector ID</dt><dd id="connectorId">-</dd>
          <dt>Home</dt><dd id="home">-</dd>
        </dl>
      </section>

      <button id="openHome">Open Connector Folder</button>

      <section>
        <h2>Capabilities</h2>
        <div class="caps" id="caps"></div>
      </section>

      <section>
        <pre id="logs"></pre>
      </section>
    </main>

    <script>
      const fields = {
        status: document.getElementById('status'),
        dot: document.getElementById('dot'),
        name: document.getElementById('name'),
        server: document.getElementById('server'),
        connectorId: document.getElementById('connectorId'),
        home: document.getElementById('home'),
        logs: document.getElementById('logs'),
        pairingSection: document.getElementById('pairingSection'),
        pairForm: document.getElementById('pairForm'),
        pairButton: document.getElementById('pairButton'),
        pairError: document.getElementById('pairError'),
        serverInput: document.getElementById('serverInput'),
        tokenInput: document.getElementById('tokenInput'),
        nameInput: document.getElementById('nameInput'),
        labelsInput: document.getElementById('labelsInput'),
        version: document.getElementById('version'),
        updateBanner: document.getElementById('updateBanner'),
        updateText: document.getElementById('updateText'),
        checkUpdates: document.getElementById('checkUpdates'),
        caps: document.getElementById('caps'),
      };

      function renderUpdate(update) {
        if (!update) {
          fields.updateBanner.classList.add('hidden');
          return;
        }
        fields.updateBanner.classList.remove('hidden');
        fields.updateBanner.classList.toggle('available', update.status === 'available' || update.status === 'downloading' || update.status === 'installing');
        const map = {
          idle: 'Updates check automatically.',
          checking: 'Checking for updates…',
          'up-to-date': 'You are on the latest version.',
          available: `Update available: v${update.latestVersion}. Installing…`,
          downloading: `Downloading update v${update.latestVersion}…`,
          installing: `Installing v${update.latestVersion}. The app will relaunch.`,
          error: `Update error: ${update.error || 'unknown'}`,
        };
        fields.updateText.textContent = map[update.status] || 'Updates check automatically.';
        fields.checkUpdates.disabled = update.status === 'checking' || update.status === 'downloading' || update.status === 'installing';
      }

      function capCell(label, info) {
        const ok = info && info.available;
        const detail = info && info.version ? info.version : (ok ? 'available' : 'missing');
        return `<div class="cap ${ok ? 'ok' : 'no'}"><b>${label}</b><span>${detail}</span></div>`;
      }

      function renderCaps(caps) {
        if (!caps) {
          fields.caps.innerHTML = '<div class="cap no"><b>Detecting…</b><span>Reading host capabilities</span></div>';
          return;
        }
        const cells = [
          capCell('Windows PowerShell', caps.shells?.windowsPowershell),
          capCell('PowerShell 7', caps.shells?.powershellCore),
          capCell('.NET SDK', caps.development?.dotnet),
          capCell('Node.js', caps.development?.node),
          capCell('Python', caps.development?.python),
          capCell('Git', caps.development?.git),
          capCell('Docker', caps.containers?.docker),
          capCell('WSL', caps.containers?.wsl),
          capCell('winget', caps.packageManagers?.winget),
          capCell('Chocolatey', caps.packageManagers?.chocolatey),
        ];
        fields.caps.innerHTML = cells.join('');
      }

      function statusText(state) {
        if (state.status === 'online') return 'Online';
        if (state.status === 'connecting') return 'Connecting';
        if (state.status === 'offline') return 'Offline - reconnecting';
        if (state.status === 'error') return 'Error';
        if (state.status === 'not_paired') return 'Not paired';
        return state.paired ? 'Running' : 'Not paired';
      }

      function render(state) {
        fields.status.textContent = statusText(state);
        fields.dot.className = `dot ${(state.status || '').replace('_', '-')}`;
        fields.name.textContent = state.name || '-';
        fields.server.textContent = state.server || '-';
        fields.connectorId.textContent = state.connectorId || '-';
        fields.home.textContent = state.home || '-';
        fields.logs.textContent = (state.logs || []).join('\n');
        fields.version.textContent = state.version ? `v${state.version}` : '';
        fields.pairingSection.classList.toggle('hidden', state.paired && state.status !== 'error');
        fields.pairError.textContent = state.error || '';
        fields.pairError.classList.toggle('hidden', !state.error);
        if (state.server && !fields.serverInput.value) fields.serverInput.value = state.server;
        if (state.name && !fields.nameInput.value) fields.nameInput.value = state.name;
        renderUpdate(state.update);
        renderCaps(state.capabilities);
      }

      window.opusConnector.getState().then(render);
      window.opusConnector.onState(render);
      window.opusConnector.onLog((line) => {
        fields.logs.textContent += `${line}\n`;
        fields.logs.scrollTop = fields.logs.scrollHeight;
      });
      document.getElementById('openHome').addEventListener('click', () => {
        window.opusConnector.openHome();
      });
      fields.checkUpdates.addEventListener('click', () => {
        window.opusConnector.checkUpdates().then(render).catch(() => {});
      });
      fields.pairForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        fields.pairButton.disabled = true;
        fields.pairButton.textContent = 'Connecting...';
        fields.pairError.classList.add('hidden');
        const result = await window.opusConnector.pair({
          server: fields.serverInput.value,
          token: fields.tokenInput.value,
          name: fields.nameInput.value,
          labels: fields.labelsInput.value,
        });
        fields.pairButton.disabled = false;
        fields.pairButton.textContent = 'Connect';
        if (!result.ok) {
          fields.pairError.textContent = result.error || 'Pairing failed.';
          fields.pairError.classList.remove('hidden');
        }
        render(result.state);
      });
    </script>
  </body>
</html>
